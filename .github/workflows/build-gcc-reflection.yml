name: Build GCC 16 (Reflection) for Debian 11

on:
  push:
    paths:
      - '.github/workflows/build-gcc-reflection.yml'
  workflow_dispatch:

jobs:
  build-gcc:
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
    env:
      INSTALL_DIR: /opt/gcc-p2996
    steps:
      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential flex bison \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev zlib1g-dev \
            ca-certificates wget tar gzip python3

      - name: Checkout GCC Source (Trunk)
        uses: actions/checkout@v4
        with:
          repository: gcc-mirror/gcc
          ref: master
          path: gcc-src
          fetch-depth: 1

      - name: Download Prerequisites
        working-directory: gcc-src
        run: |
          ./contrib/download_prerequisites

      - name: Configure GCC
        run: |
          mkdir -p build
          cd build
          ../gcc-src/configure \
            --prefix=${{ env.INSTALL_DIR }} \
            --enable-languages=c,c++ \
            --disable-multilib \
            --disable-bootstrap \
            --with-system-zlib \
            --disable-nls

      - name: Build GCC (This takes time)
        run: |
          cd build
          make -j$(nproc)

      - name: Install to Output Dir
        run: |
          cd build
          make install-strip

      - name: Package Artifact
        run: |
          tar -czvf gcc16-debian11-reflection.tar.gz -C /opt gcc-p2996

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc16-debian11-reflection
          path: gcc16-debian11-reflection.tar.gz
          retention-days: 3
