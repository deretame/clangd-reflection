name: Build GCC 16 (Reflection) for Debian 11

on:
  push:
    paths:
      - ".github/workflows/build-gcc-reflection.yml"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  build-gcc:
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye
    env:
      INSTALL_DIR: /opt/gcc-p2996
      XZ_OPT: "-T0"
    steps:
      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential flex bison ccache \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev zlib1g-dev xz-utils \
            ca-certificates tar python3

      - name: Checkout GCC Source (Trunk)
        uses: actions/checkout@v4
        with:
          repository: gcc-mirror/gcc
          ref: master
          fetch-depth: 1

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ${{ runner.os }}-debian11-gcc16-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-debian11-gcc16-

      - name: Configure GCC
        run: |
          mkdir -p build
          cd build
          export CFLAGS="-O2 -pipe"
          export CXXFLAGS="-O2 -pipe"

          ../configure \
            --prefix=${{ env.INSTALL_DIR }} \
            --enable-languages=c,c++ \
            --disable-multilib \
            --enable-bootstrap \
            --with-system-zlib \
            --disable-nls

      - name: Build GCC
        run: |
          cd build
          export CC="ccache gcc"
          export CXX="ccache g++"

          ccache -z
          make -j$(nproc)
          ccache -s

      - name: Install to Output Dir
        run: |
          cd build
          make install-strip

      - name: Package Artifact
        run: |
          tar -cJpvf gcc16-debian11-reflection.tar.xz -C /opt gcc-p2996

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc16-debian11-reflection
          path: gcc16-debian11-reflection.tar.xz
          retention-days: 3
